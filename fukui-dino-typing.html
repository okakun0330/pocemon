<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福井弁恐竜タイピング</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #1a0533 0%, #0d1f4c 50%, #1a3a1a 100%);
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
  }

  /* ===== TITLE SCREEN ===== */
  #title-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 24px;
    position: relative;
  }

  .title-dinos {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    pointer-events: none;
    overflow: hidden;
  }

  .title-dino-emoji {
    font-size: 80px;
    animation: titleBounce 1.5s ease-in-out infinite;
    opacity: 0.3;
  }

  .title-dino-emoji:nth-child(2) { animation-delay: 0.3s; }
  .title-dino-emoji:nth-child(3) { animation-delay: 0.6s; }
  .title-dino-emoji:nth-child(4) { animation-delay: 0.9s; }

  @keyframes titleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  .game-title {
    font-size: 52px;
    font-weight: 900;
    text-align: center;
    line-height: 1.2;
    text-shadow: 0 0 30px rgba(255,220,50,0.8);
    position: relative;
    z-index: 1;
  }

  .game-title .line1 { color: #FFD700; }
  .game-title .line2 { color: #7CFC00; font-size: 36px; }

  .title-sub {
    font-size: 18px;
    color: #aaa;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .difficulty-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  .difficulty-label {
    font-size: 16px;
    color: #ccc;
  }

  .difficulty-buttons {
    display: flex;
    gap: 12px;
  }

  .diff-btn {
    padding: 10px 24px;
    border-radius: 25px;
    border: 2px solid transparent;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .diff-btn.selected, .diff-btn:hover {
    background: rgba(255,255,255,0.3);
    border-color: #FFD700;
    transform: scale(1.05);
  }

  .diff-btn.easy { border-color: #7CFC00; }
  .diff-btn.normal { border-color: #FFD700; }
  .diff-btn.hard { border-color: #FF6347; }
  .diff-btn.easy.selected { background: rgba(124,252,0,0.2); }
  .diff-btn.normal.selected { background: rgba(255,215,0,0.2); }
  .diff-btn.hard.selected { background: rgba(255,99,71,0.2); }

  .start-btn {
    padding: 18px 64px;
    border-radius: 50px;
    border: none;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    color: #1a0533;
    box-shadow: 0 0 30px rgba(255,215,0,0.5);
    transition: all 0.2s;
    position: relative;
    z-index: 1;
    letter-spacing: 2px;
  }

  .start-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 50px rgba(255,215,0,0.8);
  }

  /* ===== GAME SCREEN ===== */
  #game-screen {
    display: none;
    height: 100vh;
    flex-direction: column;
    padding: 12px 20px;
    position: relative;
    overflow: hidden;
  }

  /* HUD */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .hud-item {
    text-align: center;
    min-width: 80px;
  }

  .hud-label {
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .hud-value {
    font-size: 28px;
    font-weight: 900;
    color: #FFD700;
  }

  .timer-display {
    font-size: 42px;
    font-weight: 900;
    color: #fff;
  }

  .timer-display.danger { color: #FF4444; animation: pulse 0.5s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .combo-display {
    font-size: 20px;
    color: #FF8C00;
    font-weight: bold;
  }

  .combo-display.big { font-size: 28px; color: #FFD700; animation: comboPop 0.3s ease-out; }

  @keyframes comboPop {
    0% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  /* DINO AREA */
  .dino-arena {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }

  .dino-name-badge {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 6px 20px;
    font-size: 14px;
    color: #ccc;
    margin-bottom: 8px;
  }

  .dino-name-badge span { color: #7CFC00; font-weight: bold; }

  .dino-hp-bar-wrap {
    width: 220px;
    height: 14px;
    background: rgba(0,0,0,0.4);
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.2);
    overflow: hidden;
    margin-bottom: 6px;
  }

  .dino-hp-bar {
    height: 100%;
    background: linear-gradient(90deg, #FF4444, #FF8C00);
    border-radius: 7px;
    transition: width 0.3s ease;
  }

  .dino-hp-text {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 12px;
  }

  /* DINO SVG AREA */
  .dino-container {
    position: relative;
    width: 320px;
    height: 200px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .dino-svg {
    width: 200px;
    height: 180px;
    animation: dinoIdle 1.2s ease-in-out infinite;
    transition: transform 0.2s;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
  }

  @keyframes dinoIdle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(1deg); }
  }

  .dino-svg.hit {
    animation: dinoHit 0.4s ease-out;
  }

  @keyframes dinoHit {
    0% { transform: translateX(0); filter: brightness(3) drop-shadow(0 0 20px #FF4444); }
    25% { transform: translateX(20px) rotate(10deg); }
    50% { transform: translateX(-10px) rotate(-5deg); }
    75% { transform: translateX(5px); filter: brightness(1.5); }
    100% { transform: translateX(0); filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
  }

  .dino-svg.defeated {
    animation: dinoDefeat 0.6s ease-out forwards;
  }

  @keyframes dinoDefeat {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    50% { transform: translateY(-20px) rotate(20deg); }
    100% { transform: translateY(100px) rotate(45deg); opacity: 0; }
  }

  /* EFFECTS */
  .effect-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .slash-effect {
    position: absolute;
    font-size: 60px;
    animation: slashAnim 0.5s ease-out forwards;
    pointer-events: none;
  }

  @keyframes slashAnim {
    0% { transform: scale(0.5) rotate(-20deg); opacity: 1; }
    100% { transform: scale(2) rotate(20deg); opacity: 0; }
  }

  .score-popup {
    position: absolute;
    font-size: 24px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 10px rgba(255,215,0,0.8);
    animation: scoreFloat 1s ease-out forwards;
    pointer-events: none;
    white-space: nowrap;
  }

  @keyframes scoreFloat {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-60px); opacity: 0; }
  }

  /* TYPING AREA */
  .typing-section {
    flex-shrink: 0;
    padding: 12px 0 8px;
  }

  .question-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 10px;
  }

  .question-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .question-text {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 1px;
    min-height: 40px;
  }

  .char-correct { color: #7CFC00; }
  .char-wrong { color: #FF4444; background: rgba(255,68,68,0.2); border-radius: 2px; }
  .char-pending { color: #fff; }
  .char-current { color: #FFD700; border-bottom: 2px solid #FFD700; }

  .input-box {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 22px;
    color: #fff;
    width: 100%;
    outline: none;
    caret-color: #FFD700;
    letter-spacing: 1px;
    transition: border-color 0.2s;
  }

  .input-box:focus { border-color: #FFD700; }
  .input-box.correct { border-color: #7CFC00; }
  .input-box.wrong { border-color: #FF4444; background: rgba(255,68,68,0.1); }

  /* RESULT SCREEN */
  #result-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 20px;
    padding: 20px;
  }

  .result-title {
    font-size: 44px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 30px rgba(255,215,0,0.6);
  }

  .result-cards {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .result-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 20px 28px;
    text-align: center;
    min-width: 130px;
  }

  .result-card-label {
    font-size: 12px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .result-card-value {
    font-size: 40px;
    font-weight: 900;
    color: #FFD700;
  }

  .result-card-unit {
    font-size: 14px;
    color: #888;
  }

  .result-rank {
    font-size: 56px;
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }

  .result-comment {
    font-size: 20px;
    color: #ccc;
    text-align: center;
  }

  .result-dino-list {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 12px 20px;
    max-width: 500px;
    width: 100%;
    max-height: 120px;
    overflow-y: auto;
  }

  .result-dino-list-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }

  .result-dino-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .result-dino-tag {
    background: rgba(124,252,0,0.15);
    border: 1px solid rgba(124,252,0,0.3);
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 13px;
    color: #7CFC00;
  }

  .retry-btn {
    padding: 16px 56px;
    border-radius: 50px;
    border: none;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    color: #1a0533;
    letter-spacing: 2px;
    transition: all 0.2s;
  }

  .retry-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,215,0,0.5); }

  /* BG STARS */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  #title-screen, #game-screen, #result-screen {
    position: relative;
    z-index: 1;
  }

  /* COUNTDOWN */
  .countdown-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    font-size: 120px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 60px rgba(255,215,0,0.8);
    animation: countAnim 0.8s ease-in-out;
  }

  @keyframes countAnim {
    0% { transform: scale(2); opacity: 0; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0.8; }
  }

  /* NEXT DINO ALERT */
  .next-dino-alert {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,215,0,0.2);
    border: 1px solid #FFD700;
    border-radius: 20px;
    padding: 6px 20px;
    font-size: 14px;
    color: #FFD700;
    animation: fadeInDown 0.5s ease-out;
    white-space: nowrap;
    z-index: 10;
  }

  @keyframes fadeInDown {
    0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #7CFC00, #FFD700);
    border-radius: 2px;
    transition: width 1s linear;
  }
</style>
</head>
<body>

<!-- 背景の星 -->
<div class="stars" id="stars"></div>

<!-- タイトル画面 -->
<div id="title-screen">
  <div style="text-align:center; position:relative; z-index:1;">
    <div style="font-size:80px; margin-bottom:8px;">🦕</div>
  </div>
  <div class="game-title">
    <div class="line1">福井弁恐竜</div>
    <div class="line2">タイピングバトル</div>
  </div>
  <div class="title-sub">福井弁をタイピングして恐竜を倒せ！</div>

  <div class="difficulty-section">
    <div class="difficulty-label">難易度を選んでね</div>
    <div class="difficulty-buttons">
      <button class="diff-btn easy" onclick="selectDiff('easy')">やさしい</button>
      <button class="diff-btn normal selected" onclick="selectDiff('normal')">ふつう</button>
      <button class="diff-btn hard" onclick="selectDiff('hard')">むずい</button>
    </div>
  </div>

  <button class="start-btn" onclick="startCountdown()">スタート！</button>

  <div class="title-dinos">
    <div class="title-dino-emoji">🦕</div>
    <div class="title-dino-emoji">🦖</div>
    <div class="title-dino-emoji">🦕</div>
    <div class="title-dino-emoji">🦖</div>
  </div>
</div>

<!-- ゲーム画面 -->
<div id="game-screen">
  <div class="hud">
    <div class="hud-item">
      <div class="hud-label">倒した数</div>
      <div class="hud-value" id="score-display">0</div>
    </div>
    <div style="text-align:center;">
      <div class="timer-display" id="timer-display">30</div>
      <div class="progress-bar-wrap" style="width:160px;">
        <div class="progress-bar" id="progress-bar" style="width:100%;"></div>
      </div>
    </div>
    <div class="hud-item">
      <div class="hud-label">コンボ</div>
      <div class="combo-display" id="combo-display">0x</div>
    </div>
  </div>

  <div class="dino-arena" id="dino-arena">
    <div class="dino-name-badge" id="dino-name-badge">
      <span id="dino-jp-name">フクイラプトル</span>
      <span style="color:#888; margin-left:8px; font-size:11px;" id="dino-en-name"></span>
    </div>
    <div class="dino-hp-bar-wrap">
      <div class="dino-hp-bar" id="dino-hp-bar"></div>
    </div>
    <div class="dino-hp-text" id="dino-hp-text"></div>
    <div class="dino-container">
      <div class="effect-layer" id="effect-layer"></div>
      <svg class="dino-svg" id="dino-svg" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="typing-section">
    <div class="question-box">
      <div class="question-label">タイピング</div>
      <div class="question-text" id="question-display"></div>
    </div>
    <input
      class="input-box"
      id="typing-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="ここにタイピング..."
    />
  </div>
</div>

<!-- リザルト画面 -->
<div id="result-screen">
  <div class="result-title">GAME OVER</div>
  <div class="result-rank" id="result-rank">S</div>
  <div class="result-comment" id="result-comment"></div>
  <div class="result-cards">
    <div class="result-card">
      <div class="result-card-label">倒した恐竜</div>
      <div class="result-card-value" id="res-score">0</div>
      <div class="result-card-unit">体</div>
    </div>
    <div class="result-card">
      <div class="result-card-label">最大コンボ</div>
      <div class="result-card-value" id="res-combo">0</div>
      <div class="result-card-unit">コンボ</div>
    </div>
    <div class="result-card">
      <div class="result-card-label">正確率</div>
      <div class="result-card-value" id="res-acc">0</div>
      <div class="result-card-unit">%</div>
    </div>
    <div class="result-card">
      <div class="result-card-label">タイピング数</div>
      <div class="result-card-value" id="res-chars">0</div>
      <div class="result-card-unit">文字</div>
    </div>
  </div>
  <div class="result-dino-list">
    <div class="result-dino-list-label">倒した恐竜たち</div>
    <div class="result-dino-tags" id="res-dino-list"></div>
  </div>
  <button class="retry-btn" onclick="goTitle()">もう一度！</button>
</div>

<script>
// ===== DATA =====

const DINOSAURS = [
  // 福井発掘（特別）
  { name: 'フクイラプトル', en: 'Fukuiraptor', hp: 3, color: '#e74c3c', special: true },
  { name: 'フクイサウルス', en: 'Fukuisaurus', hp: 4, color: '#27ae60', special: true },
  { name: 'フクイティタン', en: 'Fukuititan', hp: 5, color: '#2980b9', special: true },
  { name: 'コシサウルス', en: 'Koshisaurus', hp: 3, color: '#8e44ad', special: true },
  { name: 'フクイベナートル', en: 'Fukuivenator', hp: 4, color: '#d35400', special: true },
  { name: 'フクイプテリクス', en: 'Fukuipteryx', hp: 2, color: '#16a085', special: true },
  { name: 'ティラノミムス', en: 'Tyrannomimus', hp: 3, color: '#c0392b', special: true },
  // 福井恐竜博物館所蔵
  { name: 'ティラノサウルス', en: 'T.rex', hp: 6, color: '#7f0000' },
  { name: 'トリケラトプス', en: 'Triceratops', hp: 5, color: '#1a5276' },
  { name: 'ブラキオサウルス', en: 'Brachiosaurus', hp: 5, color: '#1e8449' },
  { name: 'アロサウルス', en: 'Allosaurus', hp: 4, color: '#6e2f1a' },
  { name: 'スピノサウルス', en: 'Spinosaurus', hp: 5, color: '#1a3a5c' },
  { name: 'デイノニクス', en: 'Deinonychus', hp: 3, color: '#5d4037' },
  { name: 'イグアノドン', en: 'Iguanodon', hp: 3, color: '#2d6a2d' },
  { name: 'ディプロドクス', en: 'Diplodocus', hp: 4, color: '#4a235a' },
  { name: 'パラサウロロフス', en: 'Parasaurolophus', hp: 3, color: '#1a6a5c' },
  { name: 'パキケファロサウルス', en: 'Pachycephalosaurus', hp: 3, color: '#7d6608' },
  { name: 'タルボサウルス', en: 'Tarbosaurus', hp: 5, color: '#7b241c' },
  { name: 'プロトケラトプス', en: 'Protoceratops', hp: 2, color: '#2c3e50' },
  { name: 'オウラノサウルス', en: 'Ouranosaurus', hp: 3, color: '#1a5e3a' },
  { name: 'エオラプトル', en: 'Eoraptor', hp: 2, color: '#5b2c6f' },
  { name: 'コエロフィシス', en: 'Coelophysis', hp: 2, color: '#2e4057' },
  { name: 'マメンチサウルス', en: 'Mamenchisaurus', hp: 4, color: '#0e6655' },

// ===== STATE =====

initStars();

  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));

}

function shadeColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

// ===== QUESTION SYSTEM =====
function getNextQuestion() {
  const pool = QUESTIONS[difficulty];
  const available = pool.filter(q => !usedQuestions.includes(q));
  if (available.length === 0) { usedQuestions = []; return pool[Math.floor(Math.random() * pool.length)]; }
  const q = available[Math.floor(Math.random() * available.length)];
  usedQuestions.push(q);
  return q;
}

function getNextDino() {
  const pool = [...DINOSAURS];
  // Prefer not reusing recently defeated
  const available = pool.filter(d => !defeatedDinos.slice(-3).includes(d));
  if (available.length === 0) return pool[Math.floor(Math.random() * pool.length)];
  return available[Math.floor(Math.random() * available.length)];
}

// ===== GAME FLOW =====
function startCountdown() {
  document.getElementById('title-screen').style.display = 'none';
  showCountdown(3, () => startGame());
}

function showCountdown(n, callback) {
  if (n === 0) { callback(); return; }
  const overlay = document.createElement('div');
  overlay.className = 'countdown-overlay';
  overlay.textContent = n === -1 ? 'GO!' : n;
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.remove();
    showCountdown(n - 1, callback);
  }, 900);
}

function startGame() {
  score = 0; combo = 0; maxCombo = 0;
  timeLeft = 30; totalTyped = 0; correctTyped = 0;
  defeatedDinos = []; usedQuestions = [];
  gameActive = true;

  document.getElementById('game-screen').style.display = 'flex';
  document.getElementById('score-display').textContent = '0';
  document.getElementById('combo-display').textContent = '0x';
  document.getElementById('timer-display').textContent = '30';
  document.getElementById('progress-bar').style.width = '100%';

  spawnDino();
  loadQuestion();

  const input = document.getElementById('typing-input');
  input.value = '';
  input.focus();
  input.addEventListener('input', onInput);

  timerInterval = setInterval(tick, 1000);
}

function spawnDino() {
  currentDino = getNextDino();
  const hpScale = { easy: 1, normal: 2, hard: 3 }[difficulty];
  currentDinoMaxHp = currentDino.hp * hpScale;
  currentDinoHp = currentDinoMaxHp;

  document.getElementById('dino-jp-name').textContent = currentDino.name;
  document.getElementById('dino-en-name').textContent = currentDino.en;
  updateHpBar();
  drawDino(currentDino);

  const svg = document.getElementById('dino-svg');
  svg.className = 'dino-svg';
  svg.style.animation = '';
  void svg.offsetWidth;
  svg.style.animation = null;
}

function loadQuestion() {
  currentQuestion = getNextQuestion();
  currentInput = '';
  const input = document.getElementById('typing-input');
  input.value = '';
  input.className = 'input-box';
  renderQuestion();
}

function renderQuestion() {
  const display = document.getElementById('question-display');
  let html = '';
  for (let i = 0; i < currentQuestion.length; i++) {
    const ch = currentQuestion[i];
    if (i < currentInput.length) {
      const correct = currentInput[i] === ch;
      html += `<span class="${correct ? 'char-correct' : 'char-wrong'}">${ch}</span>`;
    } else if (i === currentInput.length) {
      html += `<span class="char-current">${ch}</span>`;
    } else {
      html += `<span class="char-pending">${ch}</span>`;
    }
  }
  display.innerHTML = html;
}

function onInput(e) {
  if (!gameActive) return;
  const raw = e.target.value;
  const now = Date.now();
  const typingSpeed = now - lastTypeTime;
  lastTypeTime = now;

  totalTyped++;
  const expected = currentQuestion[currentInput.length];
  const typed = raw[raw.length - 1];

  if (typed === expected) {
    correctTyped++;
    currentInput = raw;
    document.getElementById('typing-input').className = 'input-box correct';
  } else {
    combo = 0;
    updateComboDisplay();
    document.getElementById('typing-input').className = 'input-box wrong';
    e.target.value = currentInput;
    return;
  }

  renderQuestion();

  if (currentInput.length >= currentQuestion.length) {
    onQuestionComplete(typingSpeed);
  }
}

function onQuestionComplete(typingSpeed) {
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  updateComboDisplay();

  // Damage calc: base 1, +speed bonus, +combo bonus
  const speedBonus = typingSpeed < 200 ? 2 : typingSpeed < 400 ? 1 : 0;
  const comboBonus = Math.floor(combo / 3);
  const damage = 1 + speedBonus + comboBonus;

  currentDinoHp = Math.max(0, currentDinoHp - damage);
  updateHpBar();
  showAttackEffect(damage, combo);

  const svg = document.getElementById('dino-svg');

  if (currentDinoHp <= 0) {
    svg.className = 'dino-svg defeated';
    defeatedDinos.push(currentDino);
    score++;
    document.getElementById('score-display').textContent = score;
    showScorePopup(`+1 撃破！`);

    setTimeout(() => {
      if (!gameActive) return;
      spawnDino();
      loadQuestion();
    }, 700);
  } else {
    svg.classList.remove('hit');
    void svg.offsetWidth;
    svg.className = 'dino-svg hit';
    setTimeout(() => {
      if (svg.className === 'dino-svg hit') svg.className = 'dino-svg';
    }, 400);
    loadQuestion();
  }
}

function updateHpBar() {
  const pct = currentDinoMaxHp > 0 ? (currentDinoHp / currentDinoMaxHp * 100) : 0;
  document.getElementById('dino-hp-bar').style.width = pct + '%';
  document.getElementById('dino-hp-text').textContent = `HP ${currentDinoHp} / ${currentDinoMaxHp}`;
}

function updateComboDisplay() {
  const el = document.getElementById('combo-display');
  el.textContent = combo + 'x';
  el.className = combo >= 3 ? 'combo-display big' : 'combo-display';
}

function showAttackEffect(damage, combo) {
  const layer = document.getElementById('effect-layer');
  const effects = ['⚡', '💥', '✨', '🗡️', '🔥'];
  const idx = Math.min(damage - 1, effects.length - 1);
  const el = document.createElement('div');
  el.className = 'slash-effect';
  el.textContent = effects[idx];
  el.style.left = (30 + Math.random() * 40) + '%';
  el.style.top = (20 + Math.random() * 40) + '%';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 500);

  if (combo >= 5) {
    const popup = document.createElement('div');
    popup.className = 'score-popup';
    popup.textContent = combo + 'コンボ！！';
    popup.style.left = '50%';
    popup.style.top = '10%';
    popup.style.transform = 'translateX(-50%)';
    layer.appendChild(popup);
    setTimeout(() => popup.remove(), 1000);
  }
}

function showScorePopup(text) {
  const layer = document.getElementById('effect-layer');
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.textContent = text;
  popup.style.left = '50%';
  popup.style.top = '20%';
  popup.style.transform = 'translateX(-50%)';
  layer.appendChild(popup);
  setTimeout(() => popup.remove(), 1000);
}

function tick() {
  timeLeft--;
  const timer = document.getElementById('timer-display');
  timer.textContent = timeLeft;
  document.getElementById('progress-bar').style.width = (timeLeft / 30 * 100) + '%';

  if (timeLeft <= 10) {
    timer.className = 'timer-display danger';
  }

  if (timeLeft <= 0) {
    endGame();
  }
}

function endGame() {
  gameActive = false;
  clearInterval(timerInterval);

  const input = document.getElementById('typing-input');
  input.removeEventListener('input', onInput);

  const acc = totalTyped > 0 ? Math.round(correctTyped / totalTyped * 100) : 0;

  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'flex';

  document.getElementById('res-score').textContent = score;
  document.getElementById('res-combo').textContent = maxCombo;
  document.getElementById('res-acc').textContent = acc;
  document.getElementById('res-chars').textContent = correctTyped;

  // Rank
  let rank, comment;
  if (score >= 15) { rank = 'SS'; comment = 'ほやほや、最強すぎるわいね！'; }
  else if (score >= 10) { rank = 'S'; comment = 'えらい！そんなに倒せるんけ！'; }
  else if (score >= 7) { rank = 'A'; comment = 'なかなかやるやないけ！'; }
  else if (score >= 4) { rank = 'B'; comment = 'まあまあやわいね！'; }
  else if (score >= 2) { rank = 'C'; comment = 'もっと練習せなあかんぞ！'; }
  else { rank = 'D'; comment = 'なんしとるん？がんばれや！'; }

  document.getElementById('result-rank').textContent = rank;
  document.getElementById('result-comment').textContent = comment;

  const dinoListEl = document.getElementById('res-dino-list');
  dinoListEl.innerHTML = defeatedDinos.length === 0
    ? '<span style="color:#888">まだ倒してない...</span>'
    : defeatedDinos.map(d => `<span class="result-dino-tag">${d.name}</span>`).join('');
}

function goTitle() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('title-screen').style.display = 'flex';
  document.getElementById('timer-display').className = 'timer-display';
}
</script>
