<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福井弁恐竜タイピング</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
  background: linear-gradient(160deg, #0d0d2b 0%, #0a1a0a 100%);
  min-height: 100vh;
  color: #fff;
  overflow: hidden;
}

/* ===== SCREENS ===== */
.screen { display: none; }
#screen-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 20px;
  position: relative;
}
#screen-game {
  height: 100vh;
  flex-direction: column;
  padding: 12px 16px 8px;
  position: relative;
}
#screen-result {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 16px;
  padding: 20px;
}

/* ===== STARFIELD ===== */
.starfield {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
  position: absolute; border-radius: 50%;
  background: #fff; animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.9} }

/* ===== TITLE ===== */
.game-title {
  text-align: center; position: relative; z-index: 1;
  text-shadow: 0 0 40px rgba(255,200,0,.6);
}
.game-title .line1 { font-size: 52px; font-weight: 900; color: #FFD700; }
.game-title .line2 { font-size: 30px; font-weight: 700; color: #7FFF00; margin-top: 4px; }

.title-sub {
  color: #aaa; font-size: 15px; text-align: center; position: relative; z-index: 1;
}

.diff-section { position: relative; z-index: 1; text-align: center; }
.diff-label { font-size: 13px; color: #aaa; margin-bottom: 8px; }
.diff-btns { display: flex; gap: 10px; }
.diff-btn {
  padding: 8px 22px; border-radius: 20px; border: 2px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.07); color: #ddd; font-size: 15px; font-weight: bold;
  cursor: pointer; transition: all .15s;
}
.diff-btn:hover, .diff-btn.sel {
  background: rgba(255,255,255,.2); border-color: #FFD700; color: #fff; transform: scale(1.05);
}
.diff-btn.sel.easy { border-color: #7FFF00; background: rgba(127,255,0,.12); }
.diff-btn.sel.normal { border-color: #FFD700; background: rgba(255,215,0,.12); }
.diff-btn.sel.hard { border-color: #FF6347; background: rgba(255,99,71,.12); }

.start-btn {
  padding: 16px 60px; border-radius: 40px; border: none; font-size: 22px;
  font-weight: 900; cursor: pointer; letter-spacing: 3px; position: relative; z-index: 1;
  background: linear-gradient(135deg, #FFD700, #FF8C00);
  color: #1a0533; box-shadow: 0 0 30px rgba(255,215,0,.4); transition: all .2s;
}
.start-btn:hover { transform: scale(1.07); box-shadow: 0 0 50px rgba(255,215,0,.7); }

.title-dinos {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: space-around; align-items: flex-end;
  pointer-events: none; overflow: hidden;
}
.title-dino { font-size: 90px; opacity: .25; animation: tbounce 1.8s ease-in-out infinite; }
.title-dino:nth-child(2) { animation-delay: .4s; }
.title-dino:nth-child(3) { animation-delay: .8s; }
.title-dino:nth-child(4) { animation-delay: 1.2s; }
@keyframes tbounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }

/* ===== HUD ===== */
.hud {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; flex-shrink: 0; position: relative; z-index: 1;
}
.hud-item { text-align: center; min-width: 70px; }
.hud-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.hud-value { font-size: 26px; font-weight: 900; color: #FFD700; }

.timer-wrap { text-align: center; }
.timer { font-size: 40px; font-weight: 900; color: #fff; line-height: 1; }
.timer.danger { color: #FF4444; animation: tdanger .4s ease-in-out infinite; }
@keyframes tdanger { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

.prog-wrap { width: 140px; height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; margin: 3px auto 0; }
.prog-bar { height: 100%; background: linear-gradient(90deg,#7FFF00,#FFD700); border-radius: 3px; transition: width 1s linear; }

.combo-val { font-size: 22px; font-weight: 900; color: #FF8C00; transition: all .15s; }
.combo-val.big { color: #FFD700; transform: scale(1.3); }

/* ===== DINO ARENA ===== */
.dino-arena {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; position: relative; min-height: 0;
}

.dino-badge {
  background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.15);
  border-radius: 16px; padding: 4px 18px; font-size: 13px; color: #ccc; margin-bottom: 6px;
}
.dino-badge .jp { color: #7FFF00; font-weight: bold; font-size: 15px; }
.dino-badge .en { color: #666; margin-left: 8px; font-size: 11px; }
.dino-badge .special { color: #FFD700; margin-right: 4px; }

.hp-wrap { width: 200px; height: 12px; background: rgba(0,0,0,.4); border-radius: 6px; border: 1px solid rgba(255,255,255,.15); overflow: hidden; margin-bottom: 4px; }
.hp-bar { height: 100%; background: linear-gradient(90deg,#FF4444,#FF8C00); border-radius: 6px; transition: width .3s ease; }
.hp-text { font-size: 11px; color: #777; margin-bottom: 10px; }

.dino-stage {
  position: relative;
  width: 280px; height: 210px;
  display: flex; align-items: flex-end; justify-content: center;
}
.dino-svg-wrap {
  width: 240px; height: 200px;
  animation: idle 1.4s ease-in-out infinite;
  transition: filter .1s;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,.7));
}
.dino-svg-wrap.hit { animation: hit .35s ease-out !important; }
.dino-svg-wrap.dead { animation: dead .55s ease-out forwards !important; }

@keyframes idle { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-7px) rotate(.8deg)} }
@keyframes hit {
  0%{transform:translateX(0) scale(1); filter:brightness(4) drop-shadow(0 0 20px #FF4444);}
  30%{transform:translateX(22px) rotate(12deg);}
  60%{transform:translateX(-8px) rotate(-5deg); filter:brightness(1.5);}
  100%{transform:translateX(0) rotate(0); filter:drop-shadow(0 8px 24px rgba(0,0,0,.7));}
}
@keyframes dead {
  0%{transform:translateY(0) rotate(0) scale(1); opacity:1;}
  40%{transform:translateY(-25px) rotate(25deg) scale(1.1);}
  100%{transform:translateY(150px) rotate(60deg) scale(.5); opacity:0;}
}

.effect-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.slash { position: absolute; font-size: 52px; pointer-events: none; animation: slash .45s ease-out forwards; }
@keyframes slash { 0%{transform:scale(.4) rotate(-15deg);opacity:1} 100%{transform:scale(2) rotate(20deg);opacity:0} }
.popup { position: absolute; font-size: 22px; font-weight: 900; color: #FFD700; pointer-events: none; animation: popfloat .9s ease-out forwards; white-space: nowrap; text-shadow: 0 0 8px rgba(255,215,0,.7); }
@keyframes popfloat { 0%{opacity:1;transform:translateY(0) translateX(-50%)} 100%{opacity:0;transform:translateY(-55px) translateX(-50%)} }

/* ===== TYPING ===== */
.typing-section { flex-shrink: 0; position: relative; z-index: 1; }

.q-box {
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  border-radius: 14px; padding: 12px 18px; margin-bottom: 8px;
}
.q-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.q-text { font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: 1px; min-height: 42px; }
.q-romaji { font-size: 14px; color: #555; margin-top: 4px; letter-spacing: 2px; font-family: monospace; }

.ch-ok { color: #7FFF00; }
.ch-ng { color: #FF4444; background: rgba(255,68,68,.18); border-radius: 2px; }
.ch-cur { color: #FFD700; border-bottom: 2px solid #FFD700; }
.ch-todo { color: #fff; }

.romaji-ok { color: #7FFF00; }
.romaji-ng { color: #FF4444; }
.romaji-cur { color: #FFD700; }
.romaji-todo { color: #444; }

.input-hidden {
  position: absolute; opacity: 0; pointer-events: none;
  left: -9999px; top: -9999px; width: 1px; height: 1px;
}

.input-bar {
  background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.2);
  border-radius: 10px; padding: 10px 16px; font-size: 20px; letter-spacing: 3px;
  color: #fff; min-height: 48px; font-family: monospace; transition: border-color .15s;
  display: flex; align-items: center;
}
.input-bar.ok { border-color: #7FFF00; }
.input-bar.ng { border-color: #FF4444; background: rgba(255,68,68,.08); }
.cursor-blink { display: inline-block; width: 2px; height: 22px; background: #FFD700; margin-left: 1px; animation: cblink .8s steps(1) infinite; vertical-align: middle; }
@keyframes cblink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* ===== RESULT ===== */
.res-title { font-size: 40px; font-weight: 900; color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,.5); }
.res-rank { font-size: 64px; font-weight: 900; background: linear-gradient(135deg,#FFD700,#FF8C00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.res-comment { font-size: 18px; color: #ccc; text-align: center; }
.res-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.res-card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 16px 24px; text-align: center; min-width: 110px; }
.res-card-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.res-card-val { font-size: 36px; font-weight: 900; color: #FFD700; }
.res-card-unit { font-size: 12px; color: #666; }
.res-dino-box { background: rgba(0,0,0,.3); border-radius: 10px; padding: 10px 16px; max-width: 480px; width: 100%; max-height: 100px; overflow-y: auto; }
.res-dino-label { font-size: 11px; color: #666; margin-bottom: 6px; }
.res-dino-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.res-dino-tag { background: rgba(127,255,0,.1); border: 1px solid rgba(127,255,0,.3); border-radius: 10px; padding: 2px 9px; font-size: 12px; color: #7FFF00; }
.retry-btn {
  padding: 14px 52px; border-radius: 40px; border: none; font-size: 18px; font-weight: 900;
  cursor: pointer; letter-spacing: 2px; background: linear-gradient(135deg,#FFD700,#FF8C00);
  color: #1a0533; transition: all .2s;
}
.retry-btn:hover { transform: scale(1.06); box-shadow: 0 0 28px rgba(255,215,0,.5); }

/* ===== COUNTDOWN ===== */
.countdown {
  position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  font-size: 130px; font-weight: 900; color: #FFD700;
  text-shadow: 0 0 60px rgba(255,215,0,.8);
  animation: cdshow .8s ease-out;
}
@keyframes cdshow { 0%{transform:scale(2.5);opacity:0} 50%{transform:scale(1);opacity:1} 100%{transform:scale(.85);opacity:.85} }
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>

<!-- TITLE SCREEN -->
<div id="screen-title" class="screen">
  <div style="font-size:72px;position:relative;z-index:1">🦖</div>
  <div class="game-title">
    <div class="line1">福井弁恐竜</div>
    <div class="line2">タイピングバトル</div>
  </div>
  <p class="title-sub">ローマ字でタイピングして恐竜を倒せ！<br>（例：ほや → <span style="color:#FFD700;font-family:monospace">hoya</span>）</p>

  <div class="diff-section">
    <div class="diff-label">難易度</div>
    <div class="diff-btns">
      <button class="diff-btn easy" onclick="setDiff('easy')">やさしい</button>
      <button class="diff-btn normal sel" onclick="setDiff('normal')">ふつう</button>
      <button class="diff-btn hard" onclick="setDiff('hard')">むずい</button>
    </div>
  </div>

  <button class="start-btn" onclick="startCountdown()">スタート！</button>

  <div class="title-dinos">
    <div class="title-dino">🦕</div>
    <div class="title-dino">🦖</div>
    <div class="title-dino">🦕</div>
    <div class="title-dino">🦖</div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <div class="hud">
    <div class="hud-item">
      <div class="hud-label">撃破数</div>
      <div class="hud-value" id="score-val">0</div>
    </div>
    <div class="timer-wrap">
      <div class="timer" id="timer">30</div>
      <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:100%"></div></div>
    </div>
    <div class="hud-item">
      <div class="hud-label">コンボ</div>
      <div class="combo-val" id="combo-val">0x</div>
    </div>
  </div>

  <div class="dino-arena" id="dino-arena">
    <div class="dino-badge" id="dino-badge">
      <span class="special" id="dino-special"></span>
      <span class="jp" id="dino-jp"></span>
      <span class="en" id="dino-en"></span>
    </div>
    <div class="hp-wrap"><div class="hp-bar" id="hp-bar" style="width:100%"></div></div>
    <div class="hp-text" id="hp-text">HP 3 / 3</div>
    <div class="dino-stage">
      <div class="effect-layer" id="effect-layer"></div>
      <div class="dino-svg-wrap" id="dino-wrap"></div>
    </div>
  </div>

  <div class="typing-section">
    <div class="q-box">
      <div class="q-label">タイピング（ローマ字入力）</div>
      <div class="q-text" id="q-text"></div>
      <div class="q-romaji" id="q-romaji"></div>
    </div>
    <div class="input-bar" id="input-bar">
      <span id="typed-display"></span>
      <span class="cursor-blink"></span>
    </div>
  </div>

  <input class="input-hidden" id="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</div>

<!-- RESULT SCREEN -->
<div id="screen-result" class="screen">
  <div class="res-title">GAME OVER</div>
  <div class="res-rank" id="res-rank">A</div>
  <div class="res-comment" id="res-comment"></div>
  <div class="res-cards">
    <div class="res-card">
      <div class="res-card-label">撃破数</div>
      <div class="res-card-val" id="res-score">0</div>
      <div class="res-card-unit">体</div>
    </div>
    <div class="res-card">
      <div class="res-card-label">最大コンボ</div>
      <div class="res-card-val" id="res-combo">0</div>
      <div class="res-card-unit">コンボ</div>
    </div>
    <div class="res-card">
      <div class="res-card-label">正確率</div>
      <div class="res-card-val" id="res-acc">0</div>
      <div class="res-card-unit">%</div>
    </div>
    <div class="res-card">
      <div class="res-card-label">打鍵数</div>
      <div class="res-card-val" id="res-chars">0</div>
      <div class="res-card-unit">打</div>
    </div>
  </div>
  <div class="res-dino-box">
    <div class="res-dino-label">倒した恐竜たち</div>
    <div class="res-dino-tags" id="res-dino-tags"></div>
  </div>
  <button class="retry-btn" onclick="goTitle()">もう一度！</button>
</div>

<script>
// ========== DINOSAUR DATA ==========
// emoji: 🦖=theropod, 🦕=sauropod/others
// hp: base HP (multiplied by difficulty)
// color: glow color
const DINOS = [

// text: 表示テキスト, r: 打鍵するローマ字（スペースなし・小文字）

      <circle cx="138" cy="125" r="3" fill="${light}" opacity="0.2"/>

    // Type 1: SAUROPOD (long neck)
    `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" width="240" height="200">

      <path d="M145,118 Q160,95 165,68 Q168,45 174,40" stroke="${c}" stroke-width="26" fill="none" stroke-linecap="round"/>

    // Type 3: RAPTOR (small agile)
    `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" width="240" height="200">

      <circle cx="172" cy="79" r="6" fill="#111"/>

      <path d="M98,155 L88,180 L96,178 L100,182" fill="${light}" stroke="${c}" stroke-width="1"/>
      <path d="M120,158 L116,183 L126,181 L128,184" fill="${light}" stroke="${c}" stroke-width="1"/>
      <!-- sickle claw -->
      <path d="M88,180 Q82,186 86,192" stroke="${light}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- feather hint on arms -->
      <path d="M128,132 Q122,126 118,130" stroke="${light}" stroke-width="2" fill="none" opacity="0.5"/>
      <!-- pattern dots -->
      <circle cx="112" cy="122" r="3.5" fill="${light}" opacity="0.25"/>

      <circle cx="102" cy="132" r="3" fill="${light}" opacity="0.2"/>
    </svg>`,
  ];
  return svgs[idx];
}

function lighten(hex, amount = 50) {
  let r = Math.min(255, parseInt(hex.slice(1,3),16) + amount);
  let g = Math.min(255, parseInt(hex.slice(3,5),16) + amount);
  let b = Math.min(255, parseInt(hex.slice(5,7),16) + amount);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ========== GAME STATE ==========
let diff = 'normal';
let gameActive = false;
let score = 0, combo = 0, maxCombo = 0;
let totalKeys = 0, correctKeys = 0;
let timeLeft = 30;
let timerID = null;
let defeatedDinos = [];
let usedQs = [];
let curDino = null, dinoHP = 0, dinoMaxHP = 0;
let curQ = null;    // { text, r }
let typed = '';     // ローマ字の打鍵バッファ
let lastKeyTime = 0;

// ========== INIT ==========
(function initStars() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = .5 + Math.random() * 2;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
    sf.appendChild(s);
  }
})();

function setDiff(d) {
  diff = d;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.remove('sel');
    if (b.classList.contains(d)) b.classList.add('sel');
  });
}

// ========== COUNTDOWN ==========
function startCountdown() {
  document.getElementById('screen-title').style.display = 'none';
  doCount(3);
}

function doCount(n) {
  if (n === 0) { startGame(); return; }
  const el = document.createElement('div');
  el.className = 'countdown';
  el.textContent = n;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); doCount(n - 1); }, 850);
}

// ========== GAME START ==========
function startGame() {
  score = 0; combo = 0; maxCombo = 0;
  totalKeys = 0; correctKeys = 0;
  timeLeft = 30; defeatedDinos = []; usedQs = [];
  typed = ''; gameActive = true;

  document.getElementById('screen-game').style.display = 'flex';
  document.getElementById('score-val').textContent = '0';
  document.getElementById('combo-val').textContent = '0x';
  document.getElementById('timer').textContent = '30';
  document.getElementById('timer').className = 'timer';
  document.getElementById('prog-bar').style.width = '100%';

  spawnDino();
  nextQuestion();
  updateInputDisplay();

  timerID = setInterval(tick, 1000);
  document.addEventListener('keydown', onKey);
}

// ========== DINO SPAWN ==========
function spawnDino() {
  const pool = DINOS.filter(d => !defeatedDinos.slice(-4).includes(d));
  curDino = pool[Math.floor(Math.random() * pool.length)] || DINOS[0];

  const hpMult = { easy:1, normal:2, hard:3 }[diff];
  dinoMaxHP = curDino.hp * hpMult;
  dinoHP = dinoMaxHP;

  document.getElementById('dino-jp').textContent = curDino.name;
  document.getElementById('dino-en').textContent = curDino.en;
  document.getElementById('dino-special').textContent = curDino.special ? '★' : '';
  updateHP();

  const wrap = document.getElementById('dino-wrap');
  wrap.innerHTML = buildDinoSVG(curDino);
  wrap.className = 'dino-svg-wrap';
  wrap.style.filter = `drop-shadow(0 0 22px ${curDino.color}) drop-shadow(0 8px 24px rgba(0,0,0,.7))`;
}

function updateHP() {
  const pct = dinoMaxHP > 0 ? dinoHP / dinoMaxHP * 100 : 0;
  document.getElementById('hp-bar').style.width = pct + '%';
  document.getElementById('hp-text').textContent = `HP ${dinoHP} / ${dinoMaxHP}`;
}

// ========== QUESTION ==========
function nextQuestion() {
  const pool = QS[diff];
  const avail = pool.filter(q => !usedQs.includes(q));
  if (avail.length === 0) usedQs = [];
  const q = (avail.length > 0 ? avail : pool)[Math.floor(Math.random() * (avail.length||pool.length))];
  usedQs.push(q);
  curQ = q;
  typed = '';
  renderQuestion();
}

function renderQuestion() {
  // Display text (hiragana/kanji) - no per-char coloring needed, just show it
  document.getElementById('q-text').textContent = curQ.text;

  // Romaji progress display
  const r = curQ.r;
  let html = '';
  for (let i = 0; i < r.length; i++) {
    const cls = i < typed.length ? 'romaji-ok' : i === typed.length ? 'romaji-cur' : 'romaji-todo';
    html += `<span class="${cls}">${r[i]}</span>`;
  }
  document.getElementById('q-romaji').innerHTML = html;
}

function updateInputDisplay() {
  document.getElementById('typed-display').textContent = typed;
  const bar = document.getElementById('input-bar');
  if (typed.length === 0) {
    bar.className = 'input-bar';
  }
}

// ========== KEY INPUT ==========
function onKey(e) {
  if (!gameActive) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.key === 'Backspace') {
    if (typed.length > 0) {
      typed = typed.slice(0, -1);
      renderQuestion();
      updateInputDisplay();
      document.getElementById('input-bar').className = 'input-bar';
    }
    return;
  }

  // Accept only a-z and relevant punctuation
  if (e.key.length !== 1) return;
  const ch = e.key.toLowerCase();
  if (!/[a-z]/.test(ch)) return;

  e.preventDefault();

  const now = Date.now();
  const speed = now - lastKeyTime;
  lastKeyTime = now;
  totalKeys++;

  const expected = curQ.r[typed.length];
  if (ch === expected) {
    correctKeys++;
    typed += ch;
    renderQuestion();
    updateInputDisplay();
    document.getElementById('input-bar').className = 'input-bar ok';

    if (typed.length >= curQ.r.length) {
      onComplete(speed);
    }
  } else {
    // Wrong key
    combo = 0;
    renderCombo();
    flashBar('ng');
  }
}

function flashBar(cls) {
  const bar = document.getElementById('input-bar');
  bar.className = 'input-bar ' + cls;
  setTimeout(() => { if (bar.className === 'input-bar ' + cls) bar.className = 'input-bar'; }, 250);
}

// ========== COMPLETE QUESTION ==========
function onComplete(speed) {
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  renderCombo();

  const speedBonus = speed < 150 ? 3 : speed < 300 ? 2 : speed < 500 ? 1 : 0;
  const comboBonus = Math.floor(combo / 3);
  const dmg = 1 + speedBonus + comboBonus;

  dinoHP = Math.max(0, dinoHP - dmg);
  updateHP();
  showEffect(dmg, combo);

  const wrap = document.getElementById('dino-wrap');
  if (dinoHP <= 0) {
    wrap.classList.remove('hit');
    wrap.classList.add('dead');
    defeatedDinos.push(curDino);
    score++;
    document.getElementById('score-val').textContent = score;
    showPopup('💥 撃破！ +'+(combo >= 3 ? combo+'コンボ' : ''), '50%', '15%');
    setTimeout(() => {
      if (!gameActive) return;
      spawnDino();
      nextQuestion();
      updateInputDisplay();
    }, 650);
  } else {
    wrap.className = 'dino-svg-wrap hit';
    wrap.style.filter = `drop-shadow(0 0 22px ${curDino.color}) drop-shadow(0 8px 24px rgba(0,0,0,.7))`;
    setTimeout(() => {
      if (wrap.className.includes('hit')) {
        wrap.className = 'dino-svg-wrap';
      }
    }, 380);
    nextQuestion();
    updateInputDisplay();
  }
}

function renderCombo() {
  const el = document.getElementById('combo-val');
  el.textContent = combo + 'x';
  el.className = combo >= 3 ? 'combo-val big' : 'combo-val';
}

function showEffect(dmg, combo) {
  const layer = document.getElementById('effect-layer');
  const icons = ['⚡','💥','🔥','✨','⚔️'];
  const el = document.createElement('div');
  el.className = 'slash';
  el.textContent = icons[Math.min(dmg - 1, icons.length - 1)];
  el.style.left = (20 + Math.random() * 50) + '%';
  el.style.top = (15 + Math.random() * 45) + '%';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 450);
}

function showPopup(text, x, y) {
  const layer = document.getElementById('effect-layer');
  const el = document.createElement('div');
  el.className = 'popup';
  el.textContent = text;
  el.style.left = x;
  el.style.top = y;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

// ========== TIMER ==========
function tick() {
  timeLeft--;
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('prog-bar').style.width = (timeLeft / 30 * 100) + '%';
  if (timeLeft <= 10) document.getElementById('timer').className = 'timer danger';
  if (timeLeft <= 0) endGame();
}

// ========== END GAME ==========
function endGame() {
  gameActive = false;
  clearInterval(timerID);
  document.removeEventListener('keydown', onKey);

  const acc = totalKeys > 0 ? Math.round(correctKeys / totalKeys * 100) : 0;

  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-result').style.display = 'flex';

  document.getElementById('res-score').textContent = score;
  document.getElementById('res-combo').textContent = maxCombo;
  document.getElementById('res-acc').textContent = acc;
  document.getElementById('res-chars').textContent = correctKeys;

  let rank, comment;
  if (score >= 14)     { rank = 'SS'; comment = '完璧！ふくいの恐竜マスターやわいね！'; }
  else if (score >= 10){ rank = 'S';  comment = 'えらい！そんなに倒せるんけ！'; }
  else if (score >= 7) { rank = 'A';  comment = 'なかなかやるやないけ！'; }
  else if (score >= 4) { rank = 'B';  comment = 'まあまあやわいね！'; }
  else if (score >= 2) { rank = 'C';  comment = 'もっと練習せなあかんぞ！'; }
  else                 { rank = 'D';  comment = 'なんしとるん？がんばれや！'; }

  document.getElementById('res-rank').textContent = rank;
  document.getElementById('res-comment').textContent = comment;

  const tagsEl = document.getElementById('res-dino-tags');
  tagsEl.innerHTML = defeatedDinos.length === 0
    ? '<span style="color:#666">まだ倒せてへん...</span>'
    : defeatedDinos.map(d =>
        `<span class="res-dino-tag">${d.special ? '★' : ''}${d.name}</span>`
      ).join('');
}

function goTitle() {
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-title').style.display = 'flex';
}
</script>
